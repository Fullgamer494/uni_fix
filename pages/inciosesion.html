<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFix - Inicio de Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <main id="app-container">
        <section id="view-login" class="view">
            <div class="form-container">
                <div class="form-side">
                    <a href="./Index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Regresar</a>
                    <h3>Inicio de sesión</h3>
                    <p>Ingresa tu correo y contraseña</p>
                    <form id="login-form">
                        <label for="login-email">Correo electrónico</label>
                    
                        <input type="email" id="login-email" placeholder="nombre123@gmail.com" required autocomplete="username">

                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="Al menos 8 caracteres" required minlength="8">

                        <button type="submit">Ingresar</button>
                    </form>
                    <a href="./registro.html" class="btn-secondary">Crear Registro</a>
                </div>
                <div class="brand-side">
                    <i class="fa-solid fa-building-columns"></i>
                    <h1>UniFix</h1>
                </div>
            </div>
        </section>
    </main>
    <script src="../script/script.js"></script>
</body>
</html>
